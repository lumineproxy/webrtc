# Fork-maintained copy of Pion's interop matrix. Use the standard Intel
# macOS runner while hosted arm64 capacity cannot acquire jobs.
name: Browser interoperability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: edge
          - os: macos-26-intel
            browser: safari
    steps:
      - name: Check out browser interop
        uses: actions/checkout@v7
        with:
          repository: pion/browser-tests
          ref: main
          persist-credentials: false
      - name: Check out WebRTC
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: webrtc
          persist-credentials: false
      - name: Run browser interoperability tests
        uses: ./
        env:
          DEBUG: ${{ matrix.browser == 'safari' && 'vitest:browser:*' || '' }}
        with:
          webrtc-path: webrtc
          browser: ${{ matrix.browser }}
      - name: Collect Safari startup diagnostics
        if: failure() && matrix.browser == 'safari'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/safari-diagnostics"
          {
            sw_vers
            /usr/bin/safaridriver --version
            defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
          } > "$RUNNER_TEMP/safari-diagnostics/versions.txt"
          ps -axo pid,ppid,state,etime,comm > "$RUNNER_TEMP/safari-diagnostics/processes.txt"
          /usr/bin/log show --last 5m --style compact \
            --predicate 'process == "safaridriver" OR process == "Safari"' \
            > "$RUNNER_TEMP/safari-diagnostics/safari.log"
      - name: Capture Safari startup screen
        if: failure() && matrix.browser == 'safari'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/safari-diagnostics"
          /usr/sbin/screencapture -x "$RUNNER_TEMP/safari-diagnostics/screen.png"
      - name: Upload Safari startup diagnostics
        if: failure() && matrix.browser == 'safari'
        uses: actions/upload-artifact@v7
        with:
          name: safari-startup-${{ matrix.os }}
          path: ${{ runner.temp }}/safari-diagnostics
          if-no-files-found: error
          retention-days: 7
