# Fork-maintained copy of Pion's interop matrix. Use the standard Intel
# macOS runner while hosted arm64 capacity cannot acquire jobs.
name: Browser interoperability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: edge
          - os: macos-26-intel
            browser: safari
    steps:
      - name: Check out browser interop
        uses: actions/checkout@v7
        with:
          repository: pion/browser-tests
          ref: main
          persist-credentials: false
      - name: Check out WebRTC
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: webrtc
          persist-credentials: false
      - name: Run browser interoperability tests
        uses: ./
        with:
          webrtc-path: webrtc
          browser: ${{ matrix.browser }}
