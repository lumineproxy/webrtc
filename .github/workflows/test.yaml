# Fork-maintained workflow. Native jobs reuse Pion's shared configuration;
# WASM stays local to pin a stable Node.js version for its dependencies.
# SPDX-FileCopyrightText: 2026 The Pion community <https://pion.ly>
# SPDX-License-Identifier: MIT

name: Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    uses: pion/.goassets/.github/workflows/test.reusable.yml@main
    strategy:
      matrix:
        go: ["1.27", "1.26"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}
    secrets: inherit

  test-i386:
    uses: pion/.goassets/.github/workflows/test-i386.reusable.yml@main
    strategy:
      matrix:
        go: ["1.27", "1.26"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}

  test-windows:
    uses: pion/.goassets/.github/workflows/test-windows.reusable.yml@main
    strategy:
      matrix:
        go: ["1.27", "1.26"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}

  test-macos:
    uses: pion/.goassets/.github/workflows/test-macos.reusable.yml@main
    strategy:
      matrix:
        go: ["1.27", "1.26"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}

  test-wasm:
    runs-on: ubuntu-26.04
    name: WASM
    permissions:
      contents: read
    env:
      GO_VERSION: "1.27" # auto-update/latest-go-version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache
          key: ${{ runner.os }}-wasm-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-wasm-go-

      - name: Download Go
        run: |
          version=$(
            curl -s 'https://go.dev/dl/?mode=json&include=all' \
              | jq -r '.[].version | select(startswith("go${{ env.GO_VERSION }}."))' \
              | sort -V \
              | tail -n 1
          )
          curl -sSfL https://dl.google.com/go/${version}.linux-amd64.tar.gz | tar -C ~ -xzf -

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set Go Root
        run: echo "GOROOT=${HOME}/go" >> $GITHUB_ENV

      - name: Set Go Path
        run: echo "GOPATH=${HOME}/go" >> $GITHUB_ENV

      - name: Set WASM executor
        run: echo "GO_JS_WASM_EXEC=${GOROOT}/lib/wasm/go_js_wasm_exec" >> $GITHUB_ENV

      - name: Add Go to path
        run: echo "${GOPATH}/bin" >> $GITHUB_PATH

      - name: Install NPM modules
        run: yarn install

      - name: Run Tests
        run: |
          if [ -f .github/.ci.conf ]; then . .github/.ci.conf; fi
          GOOS=js GOARCH=wasm \
          go test \
            -exec="${GO_JS_WASM_EXEC}" \
            -v ./...
